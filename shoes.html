<title>שאלון נעליים · 4M</title>
<style>
  :root { --navy:#0f2232; --navy2:#1e2a3c; --accent:#f05a3c; --line:#d5dbe3; --soft:#f3f5f8; --bad:#c62828; --ok:#1e7b34; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,"Segoe UI",sans-serif; background:#e9edf2; color:#111; font-size:16px; }
  .wrap { max-width:760px; margin:0 auto; background:#fff; min-height:100vh; }
  header { background:var(--navy); color:#fff; padding:18px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  header h1 { margin:0; font-size:22px; }
  header img { height:40px; }
  .meta { background:var(--navy2); color:#cfd8e3; font-size:13px; padding:8px 16px; display:flex; flex-wrap:wrap; gap:4px 18px; }
  .meta b { color:#fff; font-weight:600; }
  section { padding:4px 16px 14px; }
  h2 { background:var(--navy); color:#fff; font-size:15px; margin:14px -16px 12px; padding:8px 16px; }
  h2::before { content:"◄ "; font-size:10px; color:var(--accent); }
  label { display:block; font-size:13px; font-weight:700; color:#334; margin:10px 0 4px; }
  label .req { color:var(--accent); }
  input, select, textarea { width:100%; font:inherit; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px; background:#fff; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--navy2); }
  .invalid { border-color:var(--bad) !important; background:#fff5f5; }
  .err { color:var(--bad); font-size:12px; min-height:0; margin-top:3px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  @media (max-width:520px) { .grid { grid-template-columns:1fr; } }
  .item { border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .item.off { opacity:.55; }
  .item-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .item-head strong { font-size:16px; }
  .num { display:inline-grid; place-items:center; width:26px; height:26px; background:var(--navy); color:#fff; border-radius:6px; font-size:13px; margin-left:8px; }
  .toggle { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; white-space:nowrap; }
  .toggle input { width:22px; height:22px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 10px; }
  @media (max-width:520px) { .grid3 { grid-template-columns:1fr 1fr; } }
  .decl { background:var(--soft); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.7; }
  .decl p { margin:0 0 4px; }
  .check { display:flex; gap:10px; align-items:flex-start; margin-top:12px; font-weight:700; font-size:15px; }
  .check input { width:24px; height:24px; flex:none; margin-top:2px; }
  .pad { border:2px dashed #9aa4b2; border-radius:10px; background:#fff; touch-action:none; width:100%; height:180px; display:block; }
  .pad.invalid { border-color:var(--bad); }
  .pad-tools { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#667; margin-top:4px; }
  button { font:inherit; border:0; border-radius:10px; padding:14px 18px; cursor:pointer; }
  .btn-clear { background:#e4e8ee; padding:6px 12px; font-size:13px; }
  .btn-main { background:var(--accent); color:#fff; font-weight:700; width:100%; font-size:18px; margin-top:8px; }
  .btn-2 { background:var(--navy); color:#fff; font-weight:700; width:100%; margin-top:8px; }
  .summary { background:#fff5f5; border:1.5px solid var(--bad); color:var(--bad); border-radius:10px; padding:10px 14px; font-size:14px; display:none; }
  #done { display:none; padding:16px; }
  #done img { width:100%; border:1px solid var(--line); border-radius:6px; }
  .note { font-size:13px; color:#556; }
  footer { background:var(--navy); color:#9fb0c3; text-align:center; font-size:12px; padding:10px; }
  @media print { body * { visibility:hidden; } #result, #result * { visibility:visible; } #result { position:absolute; inset:0; width:100%; } }

<script>
// short personal link #u=<id>.<key>: fetch p/<id>.bin, decrypt, then reopen as #d=<details>
(async () => {
  const m = location.hash.match(/[#&]u=([\w-]+)\.([\w-]+)/);
  if (!m) return;
  document.documentElement.style.visibility = "hidden";
  try {
    const raw = Uint8Array.from(atob(m[2].replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const buf = new Uint8Array(await (await fetch("p/" + m[1] + ".bin", { cache: "no-store" })).arrayBuffer());
    const plain = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12)));
    const det = JSON.parse(new TextDecoder().decode(plain)); det.u = m[1];
    let b = ""; new TextEncoder().encode(JSON.stringify(det)).forEach(c => b += String.fromCharCode(c));
    location.replace(location.pathname + "#d=" + btoa(b).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""));
    location.reload();
  } catch (e) { document.documentElement.style.visibility = ""; alert("הקישור לא תקין — בקש קישור חדש"); }
})();
</script>

async function submitIntake(pngBlob, data) {
  const st = $("intake");
  try {
    const png = pngBlob ? new Uint8Array(await pngBlob.arrayBuffer()) : new Uint8Array(0);

    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, body));
    const wrapped = new Uint8Array(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pub, await crypto.subtle.exportKey("raw", key)));

    if (!r.ok) throw new Error(r.status);
