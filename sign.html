<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>חתימה</title>
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#0f2232; color:#fff; padding:16px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { color:#c7d2e0; font-size:14px; margin:0 0 12px; }
  canvas { width:100%; height:260px; background:#fff; border-radius:12px; touch-action:none; display:block; }
  button { font:inherit; border:0; border-radius:10px; padding:14px; width:100%; margin-top:10px; font-weight:700; font-size:17px; }
  .go { background:#f05a3c; color:#fff; } .clr { background:#e4e8ee; }
</style>
</head>
<body>
<h1>חתימת האחראי הלוגיסטי</h1>
<p>חתום עם האצבע בתוך המסגרת, ולחץ "שלח". החתימה תישלח כתמונה בווצאפ.</p>
<canvas id="c"></canvas>
<button class="go" id="send">שלח ✍️</button>
<button class="clr" id="clear">נקה</button>
<script>
const c = document.getElementById("c"), x = c.getContext("2d"); let on = false, last = null, empty = true;
function size() { const r = c.getBoundingClientRect(), d = devicePixelRatio || 1; c.width = r.width * d; c.height = r.height * d;
  x.setTransform(d, 0, 0, d, 0, 0); x.lineWidth = 3; x.lineCap = x.lineJoin = "round"; x.strokeStyle = "#0b2a6b"; }
size();
const pos = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
c.onpointerdown = e => { on = true; last = pos(e); c.setPointerCapture(e.pointerId); };
c.onpointermove = e => { if (!on) return; const q = pos(e); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(q.x, q.y); x.stroke(); last = q; empty = false; };
c.onpointerup = c.onpointercancel = () => on = false;
document.getElementById("clear").onclick = () => { x.clearRect(0, 0, c.width, c.height); empty = true; };
document.getElementById("send").onclick = () => {
  if (empty) return alert("צריך לחתום קודם");
  c.toBlob(async b => {
    const f = new File([b], "חתימה.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f] }); } catch (e) {} }
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "חתימה.png"; a.click(); }
  }, "image/png");
};
</script>
</body>
</html>
