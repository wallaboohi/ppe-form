<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>מחקר עבור פיני דגן</title>
<style>
html,body{margin:0;height:100%;background:#0e1a2e;color:#d8e0ee;font-family:'Segoe UI',Arial,sans-serif;-webkit-user-select:none;user-select:none}
#w{height:calc(100% - 46px);display:flex;align-items:center;justify-content:center}
img{max-width:100%;max-height:100%;-webkit-user-drag:none;pointer-events:none;box-shadow:0 2px 18px rgba(0,0,0,.5)}
#bar{height:46px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:15px}
button{background:#1f3a5f;color:#fff;border:0;border-radius:6px;padding:8px 18px;font-size:15px;cursor:pointer}
button:disabled{opacity:.4}
@media print{body{display:none}}
</style></head><body>
<div id="w"><img id="im" alt="שקף"></div>
<div id="bar"><button id="nx">הבא ›</button><span id="ct" dir="ltr"></span><button id="pv">‹ הקודם</button>
<span style="margin-right:18px;font-size:12px;opacity:.7">© יקיר בוחבוט · צפייה בלבד · אין להעתיק או להפיץ</span></div>
<script>
var N=41,i=1,im=document.getElementById('im');
function show(k){i=Math.max(1,Math.min(N,k));im.src='s'+('0'+i).slice(-2)+'.jpg';
document.getElementById('ct').textContent=i+' / '+N;document.getElementById('pv').disabled=i==1;document.getElementById('nx').disabled=i==N;
if(i<N)new Image().src='s'+('0'+(i+1)).slice(-2)+'.jpg';location.hash=i}
document.getElementById('nx').onclick=function(){show(i+1)};document.getElementById('pv').onclick=function(){show(i-1)};
document.onkeydown=function(e){if(e.key=='ArrowLeft'||e.key==' '||e.key=='PageDown')show(i+1);if(e.key=='ArrowRight'||e.key=='PageUp')show(i-1)};
document.oncontextmenu=function(e){e.preventDefault()};document.ondragstart=function(e){e.preventDefault()};
var tx=0;document.ontouchstart=function(e){tx=e.touches[0].clientX};document.ontouchend=function(e){var d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(d<0?i+1:i-1)};
show(parseInt(location.hash.slice(1))||1);
</script></body></html>
